name: Bug Report
description: Report a crash, missing mascot, wrong animation/state, or installer bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! For security vulnerabilities, please use [GitHub Security Advisories](https://github.com/Arnav8452/atom/security/advisories/new) instead of public issues.
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux (Arch / Ubuntu / Fedora / other)
        - macOS
        - Windows
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: Install Method
      options:
        - One-line installer (install.sh / install.ps1)
        - Git clone / local installer
        - Direct ZIP download
        - Native package (AUR / Homebrew / Scoop / Winget)
        - Portable run (python3 atom_launch.py)
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python & Antigravity Version
      placeholder: "e.g., Python 3.12.7, Antigravity 2.x"
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of what you observed vs. what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch Antigravity via ...
        2. Send prompt / trigger state ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal output / logs (if any)
      description: Output from running `python3 atom_launch.py` from a terminal (avoid pasting secrets).
      render: shell
