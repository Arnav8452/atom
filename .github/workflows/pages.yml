name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/atom/*.webp"
      - "assets/moodboard.gif"
      - "assets/screenshots/cli-*.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        run: |
          mkdir -p _site/sprites _site/cli
          cp site/index.html _site/
          cp assets/atom/*.webp _site/sprites/
          cp assets/moodboard.gif _site/
          cp assets/screenshots/cli-*.png _site/cli/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
