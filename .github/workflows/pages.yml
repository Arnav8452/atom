name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/**"
      - "art/**"
      - "tools/render_gallery.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build gallery GIFs
        run: |
          python -m pip install --quiet Pillow
          python tools/render_gallery.py --out _site/gallery
      - name: Assemble site
        run: |
          mkdir -p _site/sprites _site/cli
          cp site/index.html _site/
          # Site sprites: Atom V2 (the default skin) when present, else the classic Atom
          src=assets/v2; [ -f "$src/idle.webp" ] || src=assets/atom
          cp "$src"/*.webp "$src"/*.json _site/sprites/
          rm -f _site/sprites/skin.json
          cp assets/moodboard.gif _site/
          cp assets/screenshots/cli-*.png _site/cli/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
