name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python sources
        run: >-
          python3 -m py_compile atom_hook.py atom_launch.py
          tools/render_all.py tools/render_gemini_typing.py tools/render_idle.py
          tools/render_moodboard.py tools/make_sprite.py tools/trigger_state.py
      - name: Validate shell scripts
        if: runner.os != 'Windows'
        run: >-
          bash -n install.sh tools/build_assets.sh
          packaging/aur/PKGBUILD packaging/aur/antigravity-atom-git.install
      - name: Check bootstrap script size and JS syntax
        shell: python
        run: |
          import atom_launch, subprocess
          s = atom_launch.build_bootstrap_script()
          assert len(s) < 36000
          subprocess.run(["node", "--check", "-"], input=s, text=True, check=True)
      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Run Node.js unit tests
        run: node --test tests/test_atom_inject.mjs
